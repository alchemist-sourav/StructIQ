# ==============================================================================
# PRODUCTION CONFIGURATION
# ==============================================================================
# This configuration builds and runs the optimized production image of the frontend.

version: '3.8'

services:
  frontend:
    container_name: civilsense-frontend-prod
    
    build:
      # Build context is the frontend folder
      context: ./frontend
      # Use the multi-stage Dockerfile optimized for production
      dockerfile: Dockerfile
      
    # Expose the application on port 3000
    ports:
      - "3000:3000"
      
    environment:
      # Set Node environment to production
      - NODE_ENV=production
      # Disable Next.js telemetry
      - NEXT_TELEMETRY_DISABLED=1
      
    # Automatically restart the container if it crashes or the daemon restarts
    restart: unless-stopped
    
    # Note: Healthcheck is already defined in the Dockerfile!
